# 초안. S0 TASK 5.1 참고
default_base_url: https://openrouter.ai/api/v1
retry_waits_sec: [30, 120]   # S9: SDK 재시도(3회) 소진 뒤 429·5xx·연결 오류에 추가로 대기하는 시간 목록(초)
models:
  generate:
    id: qwen/qwen3.8-27b
    provider: {order: [deepinfra], allow_fallbacks: true, require_parameters: true, quantizations: [bf16, fp8]}
    reasoning: off
  judge:
    id: google/gemini-3.8-flash
    provider: {order: [google-ai-studio/flex], allow_fallbacks: false, require_parameters: true}   # flex 등급은 제공사 태그로 고정(standard의 절반 단가, 2026-10-07 확인)
    reasoning: {max_tokens: 800}   # OpenRouter는 effort와 max_tokens 중 하나만 받음(원안 effort: low 제거)
  compare:
    id: mistralai/mistral-large-4-0
    reasoning: off
  smoke:
    id: nvidia/nemotron-3-super-120b-a12b:free   # 원안 gemma-4-26b-a4b-it:free는 구조화 출력 미지원 + 업스트림 429(2026-10-07). S0 리포트 참고
    reasoning: off
