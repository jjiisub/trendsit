# S5 주간 브리핑 조정값 (설계 세션 초안 2026-10-09, S5 스펙 소유: 코드 세션이 고칠 수 있고 바꾼 값은 리포트에)
# 멈춤 지점(묶기 리포트) 뒤 리뷰 세션이 정한 값으로 바꾼다: cluster.thresholds, select.topics.max

evidence:
  max_tokens_per_topic: 8000        # 토픽당 근거 목록 상한(대략). 넘치면 관련성 → 채널 다양성 → 출처 균형 순으로 고름
  max_refs_per_point: 3
  video_relevance_high: 0.50        # 멈춤 지점 결정: 영상 relevance = digest 요약의 S2 관련성 점수(관심사 설명과의 코사인 최댓값). 이상 high, 아래 mid

aliases:
  auto_approve: [case, space, hyphen, dot]   # 표기 차이만 자동 승인
  fuzz_min_score: 90                # rapidfuzz 후보 최소 점수(숫자·버전이 다르면 점수와 무관하게 후보 아님)

cluster:
  thresholds:
    auto: 0.80                      # 임시값. 같은 채널 쌍은 이 이상이면 자동 묶음
    border: 0.65                    # 임시값. border~auto 사이는 decide. 채널을 넘는 쌍은 키워드·별칭 공유 + border 이상이면 decide
  # 멈춤 지점 결정(2026-10-09): auto·border 그대로. 구체적인 이름(제품·모델·프로젝트)을 공유하면 name_border 이상에서
  # 같은 채널·다른 채널 모두 decide. 회사·기관 이름만 같은 쌍은 이 경로를 타지 않는다(generic_names, 표기 차이 무시)
  name_border: 0.55
  generic_names: [OpenAI, 오픈AI, Anthropic, 앤트로픽, Google, 구글, Google DeepMind, DeepMind, 딥마인드, Microsoft,
                  마이크로소프트, MS, Meta, 메타, Amazon, 아마존, AWS, NVIDIA, 엔비디아, Apple, 애플, Alibaba, 알리바바,
                  xAI, Mistral AI, 미스트랄, Samsung, 삼성전자, 삼성, SK텔레콤, SKT, Naver, 네이버, Kakao, 카카오, LG,
                  Hugging Face, 허깅페이스, GitHub, 깃허브, Cloudflare, IBM, Oracle, 오라클, Intel, 인텔, AMD, Qualcomm,
                  퀄컴, Tesla, 테슬라, SpaceX, 스페이스X, Broadcom, 브로드컴, EU, 유럽연합, 정부, 과기정통부, MIT, Stanford]
  # 리뷰에서 확인한 의심 병합 표시(오탐: 비교 대상으로 언급된 이전 버전). 표시 규칙은 그대로, 리포트에 "확인 완료"로
  reviewed_suspicious: ["Mistral Large 3 ↔ Mistral Large 4", "GPT-5.6 ↔ GPT-6", "GPT-5.6 ↔ GPT-6 루나", "GPT-5.6 ↔ GPT-6 솔",
                        "Claude Haiku 4.5 ↔ Claude Haiku 5.5"]
  embed_text: body                  # 묶기용 임베딩: body(글은 관련성 필터 본문 임베딩) / card(모든 채널 제목 + 요약). W41 비교로 body(reports/S5_brief/embed_compare_2026-W41.md)
  linkage: average
  max_cluster_size: 12
  decide:
    max_calls_per_week: 60
    min_confidence: 0.6
  past:
    top_k: 3
    weeks_back: 4

select:
  max_candidates: 20                # 편집장 입력 상한(관련성 우선 점수)
  topics:
    min: 4
    max: 10                         # 채울 목표가 아니라 상한. 멈춤 지점에서 10으로 확정(2026-10-09)
  lead: 1
  featured_repos_max: 5

write:
  points: {single_source: [2, 3], multi_source: [3, 6]}
  overview_sentences: [2, 4]
  summary_sentences: [1, 3]
  highlights: {summary: 1, overview: 1, per_point: 1, page: [3, 4]}
  diagrams: {numbers_groups_max: 2, events_groups_max: 1, per_point_max: 1}
  concepts_max: 3

review:
  max_rounds: 3                     # 초안 1 + 수정 2. 코드 반려도 셈
  same_issue_repeat_to_check: 2     # 같은 위치·같은 이슈가 2번 남으면 check 확정
  duplicate_point_similarity: 0.8

runtime:
  weekly_target_minutes: 90
