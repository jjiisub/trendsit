# S5 주간 브리핑 조정값 (설계 세션 초안 2026-10-09, S5 스펙 소유: 코드 세션이 고칠 수 있고 바꾼 값은 리포트에)
# 멈춤 지점(묶기 리포트) 뒤 리뷰 세션이 정한 값으로 바꾼다: cluster.thresholds, select.topics.max

evidence:
  max_tokens_per_topic: 14000       # S6-1: 8000 → 14000(원문 공급, 시험 입력 최대 8.2K 토큰)
  max_refs_per_paragraph: 4         # S6-1: max_refs_per_point 대체
  video_relevance_high: 0.50        # 멈춤 지점 결정: 영상 relevance = digest 요약의 S2 관련성 점수(관심사 설명과의 코사인 최댓값). 이상 high, 아래 mid

aliases:
  fuzz_min_score: 90                # rapidfuzz 후보 최소 점수(숫자·버전이 다르면 점수와 무관하게 후보 아님)
  # 음차·약어 사전(PR #9 리뷰 R11: 한 주 안 "GPT-6 루나 / GPT-6 Luna", "딥시크-V4.1 플래시"). 낱말 단위로만 바꾼다.
  # 이 낱말만 다른 이름은 같은 이름(자동 approved, 정본은 영문), 작성자 출력의 음차 표기는 코드가 정본으로 고친다
  # 값에 음차가 여럿이면 '|'로. 띄어쓰기·하이픈은 무관하게 맞춘다(F10: "딥시크-V4.1 플래시")
  transliteration: {Luna: 루나, Sol: 솔, Astra: 아스트라, Argon: 아르곤, Flash: 플래시, DeepSeek: 딥시크, Claude: 클로드,
                    Gemini: 제미나이, Gemma: 젬마, Opus: 오퍼스, Sonnet: 소넷|소네트, Haiku: 하이쿠, Mistral: 미스트랄,
                    Llama: 라마, Qwen: 큐웬|큐원|퀜, Codex: 코덱스, Grok: 그록, Kimi: 키미, Solar: 솔라, Exaone: 엑사원,
                    HyperCLOVA: 하이퍼클로바, Decisions: 디시전스, Nemotron: 네모트론}

cluster:
  thresholds:
    auto: 0.80                      # 임시값. 같은 채널 쌍은 이 이상이면 자동 묶음
    border: 0.65                    # 임시값. border~auto 사이는 decide. 채널을 넘는 쌍은 키워드·별칭 공유 + border 이상이면 decide
  # 멈춤 지점 결정(2026-10-09): auto·border 그대로. 구체적인 이름(제품·모델·프로젝트)을 공유하면 name_border 이상에서
  # 같은 채널·다른 채널 모두 decide. 회사·기관 이름만 같은 쌍은 이 경로를 타지 않는다(generic_names, 표기 차이 무시)
  name_border: 0.55
  generic_names: [OpenAI, 오픈AI, Anthropic, 앤트로픽, Google, 구글, Google DeepMind, DeepMind, 딥마인드, Microsoft,
                  마이크로소프트, MS, Meta, 메타, Amazon, 아마존, AWS, NVIDIA, 엔비디아, Apple, 애플, Alibaba, 알리바바,
                  xAI, Mistral AI, 미스트랄, Samsung, 삼성전자, 삼성, SK텔레콤, SKT, Naver, 네이버, Kakao, 카카오, LG,
                  Hugging Face, 허깅페이스, GitHub, 깃허브, Cloudflare, IBM, Oracle, 오라클, Intel, 인텔, AMD, Qualcomm,
                  퀄컴, Tesla, 테슬라, SpaceX, 스페이스X, Broadcom, 브로드컴, EU, 유럽연합, 정부, 과기정통부, MIT, Stanford]
  # 리뷰에서 확인한 의심 병합 표시(오탐: 비교 대상으로 언급된 이전 버전). 표시 규칙은 그대로, 리포트에 "확인 완료"로
  reviewed_suspicious: ["Mistral Large 3 ↔ Mistral Large 4", "GPT-5.6 ↔ GPT-6", "GPT-5.6 ↔ GPT-6 루나", "GPT-5.6 ↔ GPT-6 솔",
                        "Claude Haiku 4.5 ↔ Claude Haiku 5.5"]
  broad_keywords: [ai-general, ai-industry, dev-practice]   # 넓은 1차 그물 키워드: 같은 대상 신호에서 뺌
  alias_decide_max: 10              # 주당 별칭 후보 decide 상한(묶기 decide 상한 안에서 먼저 씀)
  embed_text: body                  # 묶기용 임베딩: body(글은 관련성 필터 본문 임베딩) / card(모든 채널 제목 + 요약). W41 비교로 body(reports/S5_brief/embed_compare_2026-W41.md)
  max_cluster_size: 12
  decide:
    max_calls_per_week: 60
    min_confidence: 0.6
  past:
    top_k: 3
    weeks_back: 4

select:
  max_candidates: 20                # 편집장 입력 상한(묶기 점수 상위, 동점이면 관심 유사도 높은 순: 설계 결정 C-21 수정 2026-10-10)
  # C-21 원안(유사도 구간 먼저, 코드가 순서)은 미리보기에서 큰 발표가 밀려 취소(W40 지난 선정 11개 중 5개만 상위 20).
  # 토픽 순서는 편집장. 비교 표 reports/S5_brief/select_order_<week>.md
  # 설계 결정 C-20: 관련성 relevance_min 이상 영상 묶음이 입력에 있으면 영상 묶음 토픽 최소 min개
  video_slot:
    min: 1
    relevance_min: 0.55
  topics:
    min: 4
    max: 10                         # 채울 목표가 아니라 상한. 멈춤 지점에서 10으로 확정(2026-10-09)
  lead: 1
  featured_repos_max: 5

write:                              # S6-1: 절 구조(5.10)
  input: {text_chars: 6000, transcript_chars: 14000}
  summary: {sentences: [1, 2], chars_max: 200}
  sections: {single_source: [3, 5], multi_source: [4, 7]}
  paragraphs: {per_section: [1, 2], sentences_max: 4, chars_max: 320}
  heading_chars_max: 70
  head_tiles_max: 4
  tiles_per_section: [2, 3]
  visuals_max: 4
  bars_items: [2, 6]
  table: {rows: [2, 6], cols: [2, 4]}
  slides_max: 2
  video_secs_max: 3
  highlights: {summary: 1, per_paragraph: 1, page: [2, 4]}

review:
  max_rounds: 3                     # 초안 1 + 수정 2. 코드 반려도 셈
  same_issue_repeat_to_check: 2     # 같은 위치·같은 이슈가 2번 남으면 check 확정
  duplicate_point_similarity: 0.8
