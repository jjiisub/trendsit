# MVP 고정 소스 (S1에서 갱신: 백필 방법, GitHub 트렌딩 출처 변경)
# fetch:
#   feed_full    피드에 본문 전체가 있음
#   feed_summary 피드에는 요약만 → 원글 페이지에서 본문 추출(trafilatura)
#   feed_title   피드에는 제목, 링크만 → 원글 페이지에서 본문 추출
# backfill: RSS가 요청 기간을 다 담지 못할 때 쓰는 방법
#   rss_only     RSS로 충분(예상). 부족하면 리포트에 적기
#   list_pages   목록 페이지를 넘겨 가며 읽기. url_template = 1페이지, page_template = 2페이지부터({page}).
#                {since} {until}(YYYY-MM-DD)을 넣으면 기간으로 거른 목록. 날짜가 --since보다 앞서는 항목이 나오면 멈춤
#   day_archive  기간의 날짜마다 아카이브 페이지. {date}(YYYY-MM-DD) {yyyy} {Mon} {d}, {page}가 있으면 빈 페이지까지 넘김
# 백필 URL은 2026-10-07 코드 세션이 실제로 열어 확인하고 고쳤다(S1 리포트 표).
text:
  - id: openai
    name: OpenAI News
    kind: primary
    lang: en
    feed: https://openai.com/news/rss.xml
    fetch: feed_summary
    backfill: {method: rss_only}
    note: 기업 사례 글이 많음. 필터로 거름

  - id: anthropic
    name: Anthropic News
    kind: primary
    lang: en
    feed: https://raw.githubusercontent.com/Olshansk/rss-feeds/main/feeds/feed_anthropic_news.xml
    fetch: feed_summary
    backfill: {method: list_pages, url_template: "https://www.anthropic.com/news", max_pages: 1, note: "공식 RSS 없음. 커뮤니티 피드(2021~)가 멈추면 목록 페이지(최신 10건 안팎, 페이지 넘김 없음) 파싱"}

  - id: deepmind
    name: Google DeepMind Blog
    kind: primary
    lang: en
    feed: https://deepmind.google/blog/rss.xml
    fetch: feed_summary
    backfill: {method: rss_only}

  - id: geeknews
    name: GeekNews
    kind: curation
    lang: ko
    feed: https://news.hada.io/rss/news
    fetch: feed_summary
    backfill: {method: day_archive, url_template: "https://news.hada.io/past?day={date}&page={page}", note: "?page=는 추천순이라 날짜로 멈출 수 없음. 날짜별 아카이브는 하루치를 20건씩 페이지로"}
    note: RSS는 최근 50건(약 24시간). 기술 외 글이 섞임. 토픽 페이지의 한국어 요약 + 원문 링크를 함께 저장

  - id: simonw
    name: Simon Willison's Weblog
    kind: curation
    lang: en
    feed: https://simonwillison.net/atom/everything/
    fetch: feed_full
    backfill: {method: day_archive, url_template: "https://simonwillison.net/{yyyy}/{Mon}/{d}/"}
    note: 피드 20건(약 9일). 전문 + 원본 링크가 많음

  - id: aitimes
    name: AI타임스
    kind: news
    lang: ko
    feed: https://www.aitimes.com/rss/allArticle.xml
    fetch: feed_summary
    backfill: {method: list_pages, url_template: "https://www.aitimes.com/news/articleList.html?sc_sdate={since}&sc_edate={until}&view_type=sm", page_template: "https://www.aitimes.com/news/ajaxArticlePaging.php?page={page}&list_per_page=20&page_per_page=10&sc_sdate={since}&sc_edate={until}&sc_order_by=E&view_type=sm", note: "목록의 page 값은 무시됨(더보기는 JS). 2페이지부터는 AJAX JSON"}
    note: RSS는 50건(약 1.5일), 하루 20~25건. 필터 필수

video:
  - id: techbridge
    name: Tech Bridge
    lang: ko                 # 전사는 로컬 Whisper(원음, 주로 영어). 수동 자막은 보조, 자동 자막은 쓰지 않음
    channel_handle: "@TechBridge-KR"
    channel_id: UC895rbZX2iXLTDfji7W4PfA
    feed: https://www.youtube.com/feeds/videos.xml?channel_id=UC895rbZX2iXLTDfji7W4PfA
    backfill: {method: channel_listing, note: "RSS는 최근 15편. 더 필요하면 yt-dlp 채널 목록(다운로드 없음)"}

github:
  trending:
    source: github_trending_page   # OSS Insight Trends API가 현재 빈 데이터(2026-10-07). 별 스냅샷은 하지 않음
    url: https://github.com/trending?since=weekly
    top_n: 25                      # 페이지에 보이는 전체(보통 25)
  tracked:                         # 릴리스 소식만 받음
    - repo: ollama/ollama
      why: 로컬 전환 때 쓸 실행 환경
    - repo: NousResearch/hermes-agent
      why: 10주차 수업 도구
    - repo: openai/codex
      why: 코딩 에이전트. OpenAI 글과 교차
    - repo: anthropics/claude-code
      why: 코딩 에이전트. Anthropic 글과 교차
  # 릴리스 피드: https://github.com/<repo>/releases.atom / README: GitHub API(토큰 있으면 사용)
