# 네트워크와 비밀 없이 도는 검사만(API 키를 CI에 넣지 않음). 비공개 저장소 무료 Actions 시간 안에서 가볍게
name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg  # S6-1 슬라이드 프레임 테스트(ffmpeg 없으면 실패가 정상, 명세 2장)
      - run: uv run ruff check .
      - run: uv run pytest -q
