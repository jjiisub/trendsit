[project]
name = "trendsit"
version = "0.1.0"
description = "글, 유튜브 발표 영상, GitHub 트렌드로 출처 달린 기술 동향 브리핑을 만드는 개인용 AI 에이전트"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.60",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trendsit", "eval"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["site", "site_src", "data", "mockups"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # 한글은 폭 2로 세어 줄 길이 검사가 과하게 걸림

[tool.pytest.ini_options]
testpaths = ["tests"]
